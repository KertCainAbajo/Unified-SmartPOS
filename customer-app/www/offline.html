<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aling Nena Shop</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0b3b2c;
      background: radial-gradient(circle at 20% 0%, #fef3c7 0, transparent 45%), linear-gradient(160deg, #f3f9ef, #dcefdd);
    }
    .card { width: 100%; max-width: 360px; text-align: center; background: #fff; border-radius: 28px; padding: 32px 24px; box-shadow: 0 30px 60px -30px rgba(2, 44, 34, .45); }
    img { width: 96px; height: 96px; border-radius: 22px; background: #fffbea; padding: 8px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { margin: 0; color: #475569; font-size: 15px; line-height: 1.5; }
    button { margin-top: 24px; width: 100%; height: 52px; border: 0; border-radius: 16px; font-size: 16px; font-weight: 700; color: #fff; background: linear-gradient(#047857, #064e3b); }
    button:active { transform: scale(.98); }
    small { display: block; margin-top: 14px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="" />
    <h1>No connection</h1>
    <p>We could not reach Aling Nena Mini Mart. Check your internet or Wi-Fi, then try again.</p>
    <button type="button" onclick="retry()">Try again</button>
  </main>
  <script src="shop-url.js"></script>
  <script>
    // Open the shop again; if it is still unreachable the app comes back to this page.
    function retry() { window.location.href = window.SHOP_URL || '/'; }
  </script>
</body>
</html>
