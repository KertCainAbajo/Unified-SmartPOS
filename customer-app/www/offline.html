<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aling Nena Shop</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #0b3b2c;
      background: radial-gradient(circle at 50% 30%, #e6f3e4 0, transparent 60%), #fbf7ec;
    }
    .card { width: 100%; max-width: 360px; text-align: center; background: #fff; border-radius: 20px; overflow: hidden;
      border: 1px solid rgba(11, 59, 44, .1); box-shadow: 0 24px 50px -30px rgba(11, 59, 44, .5); }
    /* The mini-mart awning */
    .awning { height: 12px; background: repeating-linear-gradient(90deg, #0b6b43 0 22px, #fff 22px 44px); box-shadow: 0 3px 6px -3px rgba(6, 60, 40, .35); }
    .body { padding: 28px 24px 26px; background: linear-gradient(160deg, #eef7ea, #fff 55%, #fff5dc); }
    img { display: block; margin: 0 auto; width: 88px; height: 88px; object-fit: contain; border-radius: 20px; background: #fffbea; padding: 8px; box-shadow: 0 10px 24px -14px rgba(11, 59, 44, .6); }
    .tag { display: inline-block; margin-top: 18px; padding: 4px 10px; border-radius: 999px; background: #fef3c7; color: #92400e;
      font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: 22px; margin: 10px 0 8px; }
    p { margin: 0; color: #475569; font-size: 15px; line-height: 1.5; }
    button { margin-top: 22px; width: 100%; height: 50px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 700; color: #fff; background: #0b6b43; }
    button:active { transform: scale(.98); }
    small { display: block; margin-top: 14px; color: #94a3b8; font-size: 12px; }
  </style>
</head>
